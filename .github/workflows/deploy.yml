name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP1 }}
          username: ${{ secrets.VM_USERNAME1 }}
          password: ${{ secrets.VM_SSH_KEY1 }} # Recommended over password
          port: 22
          script: |
            set -e # Exit immediately if any command fails
            
            echo "Navigating to deployment path..."
            cd ${{ secrets.DEPLOY_PATH1 }}

            echo "Pulling latest changes..."
            git reset --hard HEAD
            git pull origin main

            echo "Installing dependencies..."
            npm install --production

            echo "Reloading PM2 application..."
            pm2 reload ecard --update-env